name = "election-online"
compatibility_date = "2026-06-09"
pages_build_output_dir = ".next"

[[d1_databases]]
binding = "DB"
database_name = "election_online_db"
database_id = "replace-with-production-d1-id"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "CANDIDATE_PHOTOS"
bucket_name = "election-online-candidate-photos"
preview_bucket_name = "election-online-candidate-photos-preview"

[vars]
ADMIN_PASSWORD = "12345678"
ELECTION_STATUS_DEFAULT = "NOT_STARTED"
